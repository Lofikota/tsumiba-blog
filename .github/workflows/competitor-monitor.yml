name: 競合モニタリング

#
# 処遇: 【止める（停止を維持）】（OPS-RED4 / 2026-07-30）
#   競合モニタリングの出力は「次にどの記事を書くか」の材料だが、Phase 0 は新規記事の
#   増産をしない方針（正本: AI運用/戦略/媒体修復実行計画_2026-07-11.md）。
#   出力を使う先が無い自動化を動かしても収益ファネルに効かないため、停止を維持する。
#   7/8の赤は本体（モニタリング→commit&push）が成功したうえで末尾のLINE通知だけが
#   落ちたもの（LINE API 400: property 'to' is invalid）。LINEは2026-07-05に補助動線へ
#   降格済みで通知先として役目を終えているため、そのステップだけ削除した。
#   → Phase 3 で再稼働させる時に同じ赤が即再発する時限爆弾を外すのが目的。schedule は復活させない。
#
on:
  # Phase 0 pause (2026-07-11): scheduled commits disabled. Manual only.
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

concurrency:
  group: tsumiba-blog-automation-${{ github.ref }}
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: write

    steps:
      - name: リポジトリをチェックアウト
        uses: actions/checkout@v4

      - name: Node.js セットアップ
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: 依存関係インストール
        run: npm ci

      - name: 競合記事モニタリング実行
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: node scripts/competitor-monitor.mjs

      - name: 変更をコミット＆プッシュ
        run: |
          git config user.name "ren-bot[bot]"
          git config user.email "bot@tsumiba.com"
          git add data/competitor-snapshots.json data/competitor-targets.json KPI管理/competitor-reports/
          git diff --staged --quiet || git commit -m "feat(monitor): 競合モニタリングレポート更新"
          git push
