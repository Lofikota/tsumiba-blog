name: 週次SEO自動改善

#
# 処遇: 【止める（廃止扱い・再稼働は要判断）】（OPS-RED4 / 2026-07-30）
#
# ⛔ schedule を戻さないこと。理由は赤いからではなく、このワークフローの設計そのもの。
#   本ワークフローは「公開記事の本文をAIが自動でリライトし、人のレビューを経ずに直接
#   main へ commit & push する」。これは制作フローの品質ゲート
#   （YOMI → TETSU → AKIRA → 公開 / CLAUDE.md）を構造的に迂回する経路であり、
#   Phase 0 の目的「公開中媒体の信頼性の修復」と正面から矛盾する。
#   BROKER-F03/F04 で、自動生成系の記事に事業者スペックの創作が群生していた実績もある。
#   → 再稼働させるなら、リライト結果を draft か PR に落として人がレビューする形に
#      作り替えてからにする。schedule を戻すだけの復活は禁止。
#
#   6/8〜7/6の赤は本体（リライト→キュー補充→commit&push）が成功したうえで末尾のLINE通知
#   だけが落ちたもの（LINE API 400: property 'to' is invalid）。LINEは2026-07-05に補助動線
#   へ降格済みのため、通知2ステップは削除した（通知の修復はしない＝再稼働させないため）。
#
on:
  # Phase 0 pause (2026-07-11): automatic rewrites disabled. Manual only.
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

concurrency:
  group: tsumiba-blog-automation-${{ github.ref }}
  cancel-in-progress: false

jobs:
  seo-rewrite:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      contents: write

    steps:
      - name: リポジトリをチェックアウト
        uses: actions/checkout@v4

      - name: Node.js セットアップ
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: 依存関係インストール
        run: npm ci

      - name: キュー事前検証
        run: npm run queue:check

      - name: SEO分析＆リライト実行
        id: seo
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GSC_SERVICE_ACCOUNT_JSON: ${{ secrets.GSC_SERVICE_ACCOUNT_JSON }}
          GSC_SITE_URL: ${{ secrets.GSC_SITE_URL }}
        run: node scripts/seo-analyzer.mjs

      - name: Astroビルド（品質確認）
        if: steps.seo.outputs.rewritten_count != '0'
        run: npm run build

      - name: キーワードキュー自動補充
        id: refill
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GSC_SERVICE_ACCOUNT_JSON: ${{ secrets.GSC_SERVICE_ACCOUNT_JSON }}
          GSC_SITE_URL: ${{ secrets.GSC_SITE_URL }}
        run: node scripts/refill-keyword-queue.mjs

      - name: キュー補充後検証
        run: npm run queue:check

      - name: 変更をコミット＆プッシュ
        id: commit
        run: |
          git config user.name "ren-bot[bot]"
          git config user.email "bot@tsumiba.com"
          git add src/content/blog/ KPI管理/ data/keyword-queue.json
          if git diff --staged --quiet; then
            echo "committed=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "feat(seo): 週次自動リライト＋キュー補充"
            git push
            echo "committed=true" >> "$GITHUB_OUTPUT"
          fi

      # 旧LINE通知2ステップは OPS-RED4（2026-07-30）で削除。
      # 冒頭コメントのとおり本ワークフローは再稼働させない方針のため、通知の作り直しもしない。
      - name: 実行結果サマリー
        if: always()
        env:
          REWRITTEN_COUNT: ${{ steps.seo.outputs.rewritten_count }}
          ADDED_COUNT: ${{ steps.refill.outputs.added_count }}
          COMMITTED: ${{ steps.commit.outputs.committed }}
        run: |
          {
            echo "## 週次SEO改善結果"
            echo ""
            echo "- リライト: ${REWRITTEN_COUNT:-0} 件"
            echo "- キュー補充: ${ADDED_COUNT:-0} 件"
            echo "- commit: ${COMMITTED:-false}"
          } >> "$GITHUB_STEP_SUMMARY"
