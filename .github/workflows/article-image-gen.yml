name: 記事ヒーロー画像 自動生成

#
# 処遇: 【止める（廃止扱い）】（OPS-RED4 / 2026-07-30）
#   赤4本の中で唯一、本体そのものが失敗していた
#   （`Image API error: Billing hard limit has been reached.` / generate-article-images.mjs:296）。
#   ＝コードのバグではなく、画像APIの支払い上限。金を足さない限り直らない。
#
#   ただし足す必要がない。2026-07-18 に画像の作り方が変わっており
#   （正本: AI運用/戦略/画像生産ライン_2026-07-18.md）、
#   現行は「Codexが文字なしベース画像を生成 → コードで記事タイトルを合成」。
#   本ワークフローの「画像APIに毎回課金して生成する」方式は既に置き換わっている。
#   → 課金を復活させて直すのではなく、廃止扱いで停止を維持する。schedule は復活させない。
#      画像が必要になったら画像生産ラインの正本に従うこと。
#
on:
  # Phase 0 pause (2026-07-11): push/scheduled image generation disabled. Manual only.
  workflow_dispatch:
    inputs:
      overwrite:
        description: '既存画像を上書き再生成する'
        type: boolean
        default: false
      limit:
        description: '最大生成件数（デフォルト: 36 = 全件）'
        type: number
        default: 36
      slug:
        description: '特定記事のみ生成する場合はslugを入力（空白 = 全記事）'
        type: string
        default: ''

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

concurrency:
  group: article-image-gen-${{ github.event_name }}
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write

    steps:
      - name: チェックアウト
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Node.js セットアップ
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: 依存関係インストール
        run: npm ci

      - name: 日本語フォントをインストール
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-noto-cjk
          fc-match 'Noto Sans CJK JP' | grep -q 'NotoSansCJK'

      # ── push トリガー：変更されたslugだけ処理 ──────────
      - name: 変更された記事のslugを抽出（pushのみ）
        id: slugs
        if: github.event_name == 'push'
        run: |
          SLUGS=$(git diff --name-only HEAD~1 HEAD -- 'src/content/blog/*.mdx' \
            | sed 's|src/content/blog/||; s|\.mdx$||' \
            | tr '\n' ' ' \
            | xargs)
          echo "list=$SLUGS" >> "$GITHUB_OUTPUT"
          echo "変更スラッグ: $SLUGS"

      - name: 画像生成（push — slug単位）
        if: github.event_name == 'push' && steps.slugs.outputs.list != ''
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          SLUGS: ${{ steps.slugs.outputs.list }}
        run: |
          for slug in $SLUGS; do
            echo "--- $slug ---"
            node scripts/generate-article-images.mjs --slug "$slug" || \
              echo "::warning:: ${slug} の画像生成に失敗しました（スキップ）"
          done

      # ── schedule：heroImageなし記事を全件処理 ──────────
      - name: 画像生成（定時 — 未生成記事を全件）
        if: github.event_name == 'schedule'
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          node scripts/generate-article-images.mjs --all --all-categories --limit 10

      # ── 手動：入力パラメータに応じて生成 ──────────────
      - name: 画像生成（手動）
        if: github.event_name == 'workflow_dispatch'
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          INPUT_SLUG: ${{ inputs.slug }}
          INPUT_OVERWRITE: ${{ inputs.overwrite }}
          INPUT_LIMIT: ${{ inputs.limit }}
        run: |
          ARGS=(--all --all-categories)
          if [ -n "$INPUT_SLUG" ]; then
            ARGS=(--slug "$INPUT_SLUG")
          fi
          if [ "$INPUT_OVERWRITE" = "true" ]; then
            ARGS+=(--overwrite)
          fi
          ARGS+=(--limit "$INPUT_LIMIT")
          echo "実行コマンド: node scripts/generate-article-images.mjs ${ARGS[*]}"
          node scripts/generate-article-images.mjs "${ARGS[@]}"

      # ── 共通：生成結果をコミット・プッシュ ─────────────
      - name: 生成した画像とheroImage更新をコミット・プッシュ
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public/images/articles/ src/content/blog/
          if git diff --staged --quiet; then
            echo "新規画像なし（すでに存在 or 生成スキップ）"
          else
            git commit -m "chore: ヒーロー画像を自動生成 [skip ci]"
            git push
          fi
