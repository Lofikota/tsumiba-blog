name: ASP承認チェック → キュー自動追加

# Claude が Gmail MCP でメールを確認し、
# data/asp-status.md を更新してコミット/push すると
# このワークフローが起動してキューを自動更新する。
# Gmail OAuth は不要。

#
# 処遇: 【直す】（OPS-RED4 / 2026-07-30）
#   7/6〜7/11の赤4本のうち、本ワークフローだけを直した。ASP承認の検知は収益ファネルの
#   右端（提携→承認CVR）に直接効くため（正本: AI運用/戦略/事業案クリティーク_2026-07-26.md）。
#   7/11の最終runはステップ単位で見ると本体（承認チェック→キュー追加）が全て成功しており、
#   落ちていたのは末尾のLINE通知だけだった（LINE API 400: property 'to' is invalid）。
#   LINEは2026-07-05に補助動線へ降格済みで、失敗通知の後継は n8n の ops-notify-failure。
#   よってLINE通知3ステップを削除し、結果は Job Summary に出す。
#   → 「exit 0で握り潰す」ではない。本体が失敗すれば従来どおりrunは赤になる。
#      壊れて誰にも届いていない通知経路を消して、赤＝本体の失敗という意味を回復させた。
#   scheduleは復活させない。ASP確認は asp-link-ops スキルで人が回す現行運用が正。
#
on:
  # Phase 0 pause (2026-07-11): push/scheduled queue mutation disabled. Manual only.
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

concurrency:
  group: asp-check
  cancel-in-progress: false

jobs:
  check-and-queue:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write

    steps:
      - name: リポジトリをチェックアウト
        uses: actions/checkout@v4

      - name: Node.js セットアップ
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: 依存関係インストール
        run: npm ci

      # ── Step1: asp-status.md から新規承認を検出 ──────────
      - name: 新規承認チェック（asp-status.md 読み取り）
        id: asp-check
        run: node scripts/asp-status-to-queue.mjs

      # ── Step2: 承認があればキューに追加 ──────────────────
      - name: keyword-queue.json に追加
        id: add-queue
        if: steps.asp-check.outputs.asp_approved_count != '0'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ASP_APPROVED_LIST: ${{ steps.asp-check.outputs.asp_approved_list }}
        run: node scripts/asp-approval-to-queue.mjs

      # ── Step3: 変更があればコミット＆プッシュ ────────────
      - name: 変更をコミット＆プッシュ
        id: commit
        if: steps.add-queue.outputs.queue_added_count != '0'
        run: |
          git config user.name "ren-bot[bot]"
          git config user.email "bot@tsumiba.com"
          git add data/keyword-queue.json data/asp-status-processed.json
          if git diff --staged --quiet; then
            echo "committed=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "feat(queue): ASP承認によりキューに自動追加"
            git push
            echo "committed=true" >> "$GITHUB_OUTPUT"
          fi

      # ── Step4: 実行結果を Job Summary に出力 ────────────────
      # 手動実行専用なので、実行者が run の画面で結果を読めれば通知の役目は足りる。
      # 旧LINE通知3ステップ（OPS-RED4で削除）はここに集約した。
      - name: 実行結果サマリー
        if: always()
        env:
          APPROVED_COUNT: ${{ steps.asp-check.outputs.asp_approved_count }}
          APPROVED_LIST: ${{ steps.asp-check.outputs.asp_approved_list }}
          ADDED_COUNT: ${{ steps.add-queue.outputs.queue_added_count }}
          ADDED_SLUGS: ${{ steps.add-queue.outputs.queue_added_slugs }}
          COMMITTED: ${{ steps.commit.outputs.committed }}
        run: |
          {
            echo "## ASP承認チェック結果"
            echo ""
            echo "| 項目 | 値 |"
            echo "| --- | --- |"
            echo "| 新規承認 | ${APPROVED_COUNT:-0} 件 |"
            echo "| 承認案件 | ${APPROVED_LIST:-（なし）} |"
            echo "| キュー追加 | ${ADDED_COUNT:-0} 件 |"
            echo "| 追加slug | ${ADDED_SLUGS:-（なし）} |"
            echo "| commit | ${COMMITTED:-false} |"
          } >> "$GITHUB_STEP_SUMMARY"
